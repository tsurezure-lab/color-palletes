<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>カラー パレット ツール集 (Color Palette Tools)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Zen Maru Gothic (Japanese) + fallback to system sans-serif for English -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Zen Maru Gothic', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: rgb(250, 245, 240);
    }
    /* Ensure Japanese text gets English translation below */
    .ja-en::after {
      content: " (" attr(data-en) ")";
      font-size: 0.875em;
      color: #6b7280;
      display: block;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-center text-indigo-800 mb-4 ja-en" data-en="Color Palette Tools">カラー パレット ツール集</h1>
    <p class="text-center text-gray-600 mb-12 ja-en" data-en="Handy color palettes and code collection for data visualization">データ可視化に便利なカラーパレットとカラーコード集</p>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- ツールカード -->
      <a href="/color-palletes/tableau-powerbi/" class="block bg-white rounded-xl shadow-lg hover:shadow-2xl transition p-6 border border-indigo-100">
        <div class="bg-gradient-to-r from-blue-500 to-teal-500 h-24 rounded-lg mb-4"></div>
        <h3 class="text-xl font-semibold text-gray-800 ja-en" data-en="BI Color Palette Viewer">BI カラーパレット ビューア</h3>
        <p class="text-sm text-gray-600 mt-1 ja-en" data-en="Preview palettes for Tableau & Power BI">Tableau & Power BI のパレットをプレビュー</p>
      </a>

      <a href="/color-palletes/figma-palettes/" class="block bg-white rounded-xl shadow-lg hover:shadow-2xl transition p-6 border border-purple-100 opacity-70">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 h-24 rounded-lg mb-4"></div>
        <h3 class="text-xl font-semibold text-gray-800 ja-en" data-en="Other Palettes (Coming Soon)">その他の パレット（準備中）</h3>
        <p class="text-sm text-gray-600 mt-1 ja-en" data-en="List of other color palettes">その他のカラーパレットを一覧</p>
      </a>

      <!-- 追加したいツールはここに -->
    </div>

    <footer class="text-center mt-16 text-gray-500 text-sm">
      Made with tsurezure-lab by <a href="https://github.com/tsurezure-lab" class="underline hover:text-indigo-600">tsurezure-lab</a>
    </footer>
  </div>
</body>
</html>
